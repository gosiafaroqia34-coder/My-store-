<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Store | Online Shop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 22px;
    }

    .cart-btn {
      background: white;
      color: #111;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 45px 20px;
      background: white;
    }

    .hero h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #666;
      margin-bottom: 20px;
    }

    .search {
      width: 90%;
      max-width: 500px;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    .products {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .products h2 {
      margin-bottom: 20px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .product-info {
      padding: 15px;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .price {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .add-btn {
      width: 100%;
      padding: 11px;
      background: #111;
      color: white;
      border: none;
      border-radius: 7px;
      cursor: pointer;
    }

    .add-btn:hover {
      background: #333;
    }

    .cart {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .cart-box {
      background: white;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 12px;
      padding: 20px;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .close {
      border: none;
      background: #eee;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .cart-item {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
      margin: 20px 0;
    }

    .order-form input,
    .order-form textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 7px;
    }

    .order-btn {
      width: 100%;
      padding: 13px;
      background: #111;
      color: white;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 30px;
      margin-top: 40px;
      background: #111;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <h1>My Store</h1>
    <button class="cart-btn" onclick="openCart()">
      🛒 Cart (<span id="cartCount">0</span>)
    </button>
  </header>

  <section class="hero">
    <h2>Welcome to My Store</h2>
    <p>Quality products at great prices</p>

    <input
      type="text"
      class="search"
      id="search"
      placeholder="Search products..."
      oninput="searchProducts()"
    >
  </section>

  <section class="products">
    <h2>Our Products</h2>

    <div class="product-grid" id="productGrid">

      <div class="product" data-name="Watch">
        <img src="https://images.unsplash.com/photo-1524805444758-089113d48a6d?auto=format&fit=crop&w=600&q=80" alt="Watch">

        <div class="product-info">
          <h3>Classic Watch</h3>
          <p class="price">Rs. 2,500</p>

          <button
            class="add-btn"
            onclick="addToCart('Classic Watch', 2500)"
          >
            Add to Cart
          </button>
        </div>
      </div>


      <div class="product" data-name="Shoes">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80" alt="Shoes">

        <div class="product-info">
          <h3>Fashion Shoes</h3>
          <p class="price">Rs. 3,500</p>

          <button
            class="add-btn"
            onclick="addToCart('Fashion Shoes', 3500)"
          >
            Add to Cart
          </button>
        </div>
      </div>


      <div class="product" data-name="Bag">
        <img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=600&q=80" alt="Bag">

        <div class="product-info">
          <h3>Stylish Bag</h3>
          <p class="price">Rs. 2,000</p>

          <button
            class="add-btn"
            onclick="addToCart('Stylish Bag', 2000)"
          >
            Add to Cart
