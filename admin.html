<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Store | Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 22px;
    }

    .logout-btn {
      background: white;
      color: #111;
      border: none;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    .card h2 {
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 15px;
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .save-btn,
    .login-btn {
      width: 100%;
      padding: 13px;
      background: #111;
      color: white;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }

    .save-btn:hover,
    .login-btn:hover {
      background: #333;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      background: #eee;
      border-radius: 7px;
      display: none;
    }

    .login-box {
      max-width: 450px;
      margin: 60px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .login-box h2 {
      margin-bottom: 20px;
      text-align: center;
    }

    #adminPanel {
      display: none;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginBox" class="login-box">

    <h2>Admin Login</h2>

    <div class="form-group">
      <label>Email</label>

      <input
        type="email"
        id="email"
        placeholder="Admin email"
      >
    </div>

    <div class="form-group">
      <label>Password</label>

      <input
        type="password"
        id="password"
        placeholder="Password"
      >
    </div>

    <button class="login-btn" onclick="login()">
      Login
    </button>

  </div>


  <!-- ADMIN PANEL -->
  <div id="adminPanel">

    <header>

      <h1>My Store Admin</h1>

      <button class="logout-btn" onclick="logout()">
        Logout
      </button>

    </header>


    <div class="container">

      <div class="card">

        <h2>Add / Update Product</h2>


        <!-- PRODUCT NAME -->
        <div class="form-group">

          <label>Product Name</label>

          <input
            type="text"
            id="productName"
            placeholder="Example: Classic Watch"
          >

        </div>


        <!-- DESCRIPTION -->
        <div class="form-group">

          <label>Description</label>

          <textarea
            id="description"
            placeholder="Product description"
          ></textarea>

        </div>


        <!-- PRICE -->
        <div class="form-group">

          <label>Price (Rs.)</label>

          <input
            type="number"
            id="price"
            placeholder="2500"
          >

        </div>


        <!-- IMAGE URL -->
        <div class="form-group">

          <label>Image URL</label>

          <input
            type="text"
            id="imageUrl"
            placeholder="https://..."
          >

        </div>


        <!-- STOCK -->
        <div class="form-group">

          <label>Stock</label>

          <input
            type="number"
            id="stock"
            placeholder="10"
          >

        </div>


        <!-- SAVE -->
        <button
          class="save-btn"
          onclick="saveProduct()"
        >
          Save Product
        </button>


        <!-- STATUS -->
        <div id="status" class="status"></div>

      </div>

    </div>

  </div>


  <!-- SUPABASE -->

      document.getElementById("adminPanel").style.display =
        "none";

      document.getElementById("loginBox").style.display =
