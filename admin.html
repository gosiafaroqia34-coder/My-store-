<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Store | Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 22px;
    }

    .logout-btn {
      background: white;
      color: #111;
      border: none;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    .card h2 {
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 15px;
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .login-box {
      max-width: 450px;
      margin: 60px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .login-box h2 {
      margin-bottom: 20px;
      text-align: center;
    }

    .login-btn,
    .save-btn {
      width: 100%;
      padding: 13px;
      background: #111;
      color: white;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }

    .login-btn:hover,
    .save-btn:hover {
      background: #333;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      background: #eee;
      border-radius: 7px;
      display: none;
      word-break: break-word;
    }

    #adminPanel {
      display: none;
    }

    .welcome {
      margin-bottom: 20px;
      color: #666;
    }
  </style>
</head>

<body>


  <!-- =========================
       LOGIN SCREEN
       ========================= -->

  <div id="loginBox" class="login-box">

    <h2>Admin Login</h2>

    <div class="form-group">
      <label>Email</label>

      <input
        type="email"
        id="email"
        placeholder="Admin email"
        autocomplete="email"
      >
    </div>


    <div class="form-group">
      <label>Password</label>

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
      >
    </div>


    <button
      class="login-btn"
      onclick="login()"
    >
      Login
    </button>


    <div
      id="loginStatus"
      class="status"
    ></div>

  </div>



  <!-- =========================
       ADMIN PANEL
       ========================= -->

  <div id="adminPanel">

    <header>

      <h1>My Store Admin</h1>

      <button
        class="logout-btn"
        onclick="logout()"
      >
        Logout
      </button>

    </header>


    <div class="container">

      <p class="welcome">
        Admin panel — products yahan se manage karo.
      </p>


      <div class="card">

        <h2>Add Product</h2>


        <!-- PRODUCT NAME -->

        <div class="form-group">

          <label>Product Name</label>

          <input
            type="text"
            id="productName"
            placeholder="Example: Classic Watch"
          >

        </div>


        <!-- DESCRIPTION -->

        <div class="form-group">

          <label>Description</label>

          <textarea
            id="description"
            placeholder="Product description"
          ></textarea>

        </div>


        <!-- PRICE -->

        <div class="form-group">

          <label>Price (Rs.)</label>

          <input
            type="number"
            id="price"
            placeholder="2500"
            min="0"
          >

        </div>


        <!-- IMAGE -->

        <div class="form-group">

          <label>Image URL</label>

          <input
            type="url"
            id="imageUrl"
            placeholder="https://example.com/image.jpg"
          >

        </div>


        <!-- STOCK -->

        <div class="form-group">

          <label>Stock</label>

          <input
            type="number"
            id="stock"
            placeholder="10"
            min="0"
          >

        </div>


        <!-- SAVE -->

        <button
          class="save-btn"
          onclick="saveProduct()"
        >
          Save Product
        </button>


        <div
          id="status"
          class="status"
        ></div>

      </div>

    </div>

  </div>



  <!-- =========================
       SUPABASE LIBRARY
       ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* =========================
       SUPABASE SETTINGS
       ========================= */

    const SUPABASE_URL =
      "https://iuoknttbaqtjkvtdsmnc.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_-7nAjjkLSd4A_9uENlNB2Q_GHbltB4M";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );



    /* =========================
       LOGIN
       ========================= */

    async function login() {

      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      const loginStatus =
        document.getElementById(
          "loginStatus"
        );


      if (!email || !password) {

        loginStatus.style.display =
          "block";

        loginStatus.innerText =
          "Email aur password enter karo.";

        return;
      }


      loginStatus.style.display =
        "block";

      loginStatus.innerText =
        "Login ho raha hai...";


      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({

            email: email,

            password: password

          });


      if (error) {

        console.error(error);


        loginStatus.innerText =
          "Login failed: " +
          error.message;

        return;
      }


      console.log(
        "Logged in user:",
        data.user
      );


      loginStatus.style.display =
        "none";


      document
        .getElementById("loginBox")
        .style.display = "none";


      document
        .getElementById("adminPanel")
        .style.display = "block";

    }



    /* =========================
       CHECK EXISTING LOGIN
       ========================= */

    async function checkSession() {

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .getSession();


      if (error) {

        console.error(error);

        return;
      }


      if (data.session) {

        document
          .getElementById("loginBox")
          .style.display = "none";


        document
          .getElementById("adminPanel")
          .style.display = "block";

      }

    }



    /* =========================
       LOGOUT
       ========================= */

    async function logout() {

      await supabaseClient.auth
        .signOut();


      document
        .getElementById("adminPanel")
        .style.display = "none";


      document
        .getElementById("loginBox")
        .style.display = "block";


      document
        .getElementById("email")
        .value = "";


      document
        .getElementById("password")
        .value = "";

    }



    /* =========================
       SAVE PRODUCT
       ========================= */

    async function saveProduct() {

      const name =
        document
          .getElementById("productName")
          .value
          .trim();


      const description =
        document
          .getElementById("description")
          .value
          .trim();


      const price =
        Number(
          document
            .getElementById("price")
            .value
        );


      const imageUrl =
        document
          .getElementById("imageUrl")
          .value
          .trim();


      const stock =
        Number(
          document
            .getElementById("stock")
            .value
        );


      const status =
        document.getElementById(
          "status"
        );


      /* VALIDATION */

      if (!name) {

        status.style.display =
          "block";

        status.innerText =
          "Product name enter karo.";

        return;
      }


      if (!price || price <= 0) {

        status.style.display =
          "block";

        status.innerText =
          "Valid price enter karo.";

        return;
      }


      if (
        Number.isNaN(stock) ||
        stock < 0
      ) {

        status.style.display =
          "block";

        status.innerText =
          "Valid stock enter karo.";

        return;
      }


      status.style.display =
        "block";

      status.innerText =
        "Product database mein save ho raha hai...";


      /* CURRENT USER */

      const {
        data: userData,
        error: userError
      } =
        await supabaseClient.auth
          .getUser();


      if (userError || !userData.user) {

        status.innerText =
          "Login session nahi hai. Dobara login karo.";

        return;
      }


      /* DATABASE INSERT */

      const {
        data,
        error
      } =
        await supabaseClient
          .from("products")
          .insert({

            name: name,

            description:
              description || null,

            price: price,

            image_url:
              imageUrl || null,

            stock: stock

          })
          .select();


      /* DATABASE ERROR */

      if (error) {

        console.error(
          "Supabase error:",
          error
        );


        status.innerText =
          "Database Error: " +
          error.message;

        return;
      }


      /* SUCCESS */

      status.innerText =
        "✅ Product database mein save ho gaya!";


      console.log(
        "Saved product:",
        data
      );


      /* CLEAR FORM */

      document
        .getElementById("productName")
        .value = "";


      document
        .getElementById("description")
        .value = "";


      document
        .getElementById("price")
        .value = "";


      document
        .getElementById("imageUrl")
        .value = "";


      document
        .getElementById("stock")
        .value = "";

    }



    /* =========================
       START
       ========================= */

    checkSession();

  </script>

</body>
</html>
