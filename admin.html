<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://iuoknttbaqtjkvtdsmnc.supabase.co";

  const SUPABASE_KEY = "YAHAN_APNI_PUBLISHABLE_KEY_PASTE_KARO";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      alert("Email aur password enter karo.");
      return;
    }

    // Filhaal test login
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
  }


  function logout() {
    document.getElementById("adminPanel").style.display = "none";
    document.getElementById("loginBox").style.display = "block";
  }


  async function saveProduct() {

    const name = document.getElementById("productName").value.trim();
    const description = document.getElementById("description").value.trim();
    const price = Number(document.getElementById("price").value);
    const imageUrl = document.getElementById("imageUrl").value.trim();
    const stock = Number(document.getElementById("stock").value);

    if (!name || !price) {
      alert("Product name aur price enter karo.");
      return;
    }

    const status = document.getElementById("status");

    status.style.display = "block";
    status.innerText = "Product save ho raha hai...";

    const { data, error } = await supabaseClient
      .from("products")
      .insert([
        {
          name: name,
          description: description,
          price: price,
          image_url: imageUrl,
          stock: stock
        }
      ])
      .select();

    if (error) {
      console.error(error);

      status.innerText =
        "Error: " + error.message;

      return;
    }

    status.innerText =
      "Product successfully save ho gaya: " +
      name + " - Rs. " + price;

    // Form clear
    document.getElementById("productName").value = "";
    document.getElementById("description").value = "";
    document.getElementById("price").value = "";
    document.getElementById("imageUrl").value = "";
    document.getElementById("stock").value = "";
  }
</script>a
