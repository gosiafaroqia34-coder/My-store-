<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Store | Online Shop</title>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 22px;
    }

    .cart-btn {
      background: white;
      color: #111;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 45px 20px;
      background: white;
    }

    .hero h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #666;
      margin-bottom: 20px;
    }

    .search {
      width: 90%;
      max-width: 500px;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    .search:focus {
      border-color: #111;
    }

    .products {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .products h2 {
      margin-bottom: 20px;
    }

    .product-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow:
        0 3px 12px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      background: #eee;
    }

    .product-info {
      padding: 15px;
    }

    .product h3 {
      margin-bottom: 8px;
      font-size: 20px;
    }

    .description {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .price {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .stock {
      color: #555;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .add-btn {
      width: 100%;
      padding: 11px;
      background: #111;
      color: white;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .add-btn:hover {
      background: #333;
    }

    .add-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .loading {
      text-align: center;
      padding: 40px;
      background: white;
      border-radius: 12px;
      color: #666;
    }

    .error-box {
      background: #fff0f0;
      color: #b00020;
      padding: 20px;
      border-radius: 10px;
      line-height: 1.6;
    }

    .empty-box {
      background: white;
      padding: 40px 20px;
      text-align: center;
      border-radius: 12px;
      color: #666;
    }

    .cart {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .cart-box {
      background: white;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 12px;
      padding: 20px;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .cart-header h2 {
      font-size: 24px;
    }

    .close {
      border: none;
      background: #eee;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
    }

    .cart-item {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
    }

    .cart-item-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .cart-item-name {
      font-weight: bold;
    }

    .cart-item-price {
      font-weight: bold;
    }

    .cart-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .qty-btn {
      border: none;
      background: #eee;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
    }

    .remove-btn {
      border: none;
      background: #ffe5e5;
      color: #b00020;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-left: auto;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
      margin: 20px 0;
    }

    .order-form {
      margin-top: 15px;
    }

    .order-form h3 {
      margin-bottom: 12px;
    }

    .order-form input,
    .order-form textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 15px;
      outline: none;
    }

    .order-form textarea {
      min-height: 90px;
      resize: vertical;
    }

    .order-btn {
      width: 100%;
      padding: 13px;
      background: #111;
      color: white;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }

    .order-btn:hover {
      background: #333;
    }

    .cart-empty {
      text-align: center;
      padding: 30px 10px;
      color: #666;
    }

    .success-message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: #e9f8ee;
      color: #146c2e;
      border-radius: 7px;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 30px;
      margin-top: 40px;
      background: #111;
      color: white;
    }

    @media (max-width: 600px) {

      header {
        padding: 15px;
      }

      header h1 {
        font-size: 20px;
      }

      .cart-btn {
        padding: 9px 12px;
      }

      .hero {
        padding: 35px 15px;
      }

      .hero h2 {
        font-size: 27px;
      }

      .products {
        margin-top: 25px;
      }

      .product img {
        height: 230px;
      }

    }

  </style>

</head>

<body>


  <!-- HEADER -->

  <header>

    <h1>My Store</h1>

    <button
      class="cart-btn"
      onclick="openCart()"
    >
      🛒 Cart (<span id="cartCount">0</span>)
    </button>

  </header>


  <!-- HERO -->

  <section class="hero">

    <h2>Welcome to My Store</h2>

    <p>
      Quality products at great prices
    </p>

    <input
      type="text"
      class="search"
      id="search"
      placeholder="Search products..."
      oninput="searchProducts()"
    >

  </section>


  <!-- PRODUCTS -->

  <section class="products">

    <h2>Our Products</h2>

    <div
      class="product-grid"
      id="productGrid"
    >

      <div class="loading">
        Products loading...
      </div>

    </div>

  </section>


  <!-- CART -->

  <div
    class="cart"
    id="cart"
  >

    <div class="cart-box">

      <div class="cart-header">

        <h2>Your Cart</h2>

        <button
          class="close"
          onclick="closeCart()"
        >
          ✕
        </button>

      </div>


      <div id="cartItems">

        <div class="cart-empty">
          Your cart is empty.
        </div>

      </div>


      <div
        class="total"
        id="cartTotal"
      >
        Total: Rs. 0
      </div>


      <div class="order-form">

        <h3>Customer Details</h3>

        <input
          type="text"
          id="customerName"
          placeholder="Your name"
        >

        <input
          type="tel"
          id="customerPhone"
          placeholder="Phone number"
        >

        <input
          type="text"
          id="customerAddress"
          placeholder="Delivery address"
        >

        <textarea
          id="customerNote"
          placeholder="Order note (optional)"
        ></textarea>

        <button
          class="order-btn"
          onclick="placeOrder()"
        >
          Place Order
        </button>

        <div
          class="success-message"
          id="successMessage"
        >
          Order details ready.
        </div>

      </div>

    </div>

  </div>


  <!-- FOOTER -->

  <footer>

    <p>
      © 2026 My Store. All rights reserved.
    </p>

  </footer>


  <!-- JAVASCRIPT -->

  <script>

    /*
      ==========================================
      SUPABASE CONNECTION
      ==========================================
    */

    const SUPABASE_URL =
      "https://iuokntbqtjkvtdsmnc.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_-7nAjjkLSd4A_9uENlNB2Q_GHbltB4M";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /*
      ==========================================
      CART
      ==========================================
    */

    let cart = [];


    /*
      ==========================================
      LOAD PRODUCTS
      ==========================================
    */

    async function loadProducts() {

      const grid =
        document.getElementById("productGrid");

      grid.innerHTML = `
        <div class="loading">
          Products loading...
        </div>
      `;


      try {

        const { data, error } =
          await supabaseClient
            .from("products")
            .select("*")
            .order("id", {
              ascending: false
            });


        if (error) {

          console.error(
            "Supabase error:",
            error
          );

          grid.innerHTML = `
            <div class="error-box">
              <strong>Products load nahi ho rahe.</strong>
              <br><br>
              ${escapeHtml(error.message)}
            </div>
          `;

          return;
        }


        if (!data || data.length === 0) {

          grid.innerHTML = `
            <div class="empty-box">
              Abhi koi product available nahi hai.
            </div>
          `;

          return;
        }


        grid.innerHTML = "";


        data.forEach(product => {

          const name =
            product.name || "Product";


          const description =
            product.description || "";


          const price =
            Number(product.price || 0);


          const image =
            product.image_url ||
            product.image ||
            "https://via.placeholder.com/600x400?text=Product";


          const stock =
            Number(product.stock ?? 0);


          const productDiv =
            document.createElement("div");


          productDiv.className =
            "product";


          productDiv.dataset.name =
            name.toLowerCase();


          const safeName =
            escapeHtml(name);


          const safeDescription =
            escapeHtml(description);


          const safeImage =
            escapeHtml(image);


          productDiv.innerHTML = `

            <img
              src="${safeImage}"
              alt="${safeName}"
              onerror="this.src='https://via.placeholder.com/600x400?text=Product'"
            >

            <div class="product-info">

              <h3>
                ${safeName}
              </h3>

              <p class="description">
                ${safeDescription}
              </p>

              <p class="price">
                Rs. ${price.toLocaleString()}
              </p>

              <p class="stock">
                Stock: ${stock}
              </p>

              <button
                class="add-btn"
                data-id="${product.id}"
                ${stock <= 0 ? "disabled" : ""}
              >
                ${
                  stock <= 0
                    ? "Out of Stock"
                    : "Add to Cart"
                }
              </button>

            </div>
          `;


          const addButton =
            productDiv.querySelector(".add-btn");


          if (stock > 0) {

            addButton.addEventListener(
              "click",
              function() {

                addToCart(
                  product.id,
                  name,
                  price,
                  stock
                );

              }
            );

          }


          grid.appendChild(productDiv);

        });


      } catch (error) {

        console.error(error);

        grid.innerHTML = `
          <div class="error-box">
            Products load karte waqt error aa gaya.
          </div>
        `;

      }

    }


    /*
      ==========================================
      ESCAPE HTML
      ==========================================
    */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
      ==========================================
      SEARCH
      ==========================================
    */

    function searchProducts() {

      const search =
        document
          .getElementById("search")
          .value
          .toLowerCase()
          .trim();


      const products =
        document.querySelectorAll(".product");


      products.forEach(product => {

        const name =
          product.dataset.name || "";


        if (name.includes(search)) {

          product.style.display = "";

        } else {

          product.style.display = "none";

        }

      });

    }


    /*
      ==========================================
      ADD TO CART
      ==========================================
    */

    function addToCart(
      id,
      name,
      price,
      stock
    ) {

      const existing =
        cart.find(item => item.id === id);


      if (existing) {

        if (existing.quantity < stock) {

          existing.quantity++;

        } else {

          alert(
            "Itna stock available nahi hai."
          );

          return;

        }

      } else {

        cart.push({

          id: id,

          name: name,

          price: price,

          stock: stock,

          quantity: 1

        });

      }


      updateCart();


      alert(
        name + " cart mein add ho gaya."
      );

    }


    /*
      ==========================================
      REMOVE FROM CART
      ==========================================
    */

    function removeFromCart(id) {

      cart =
        cart.filter(
          item => item.id !== id
        );


      updateCart();

    }


    /*
      ==========================================
      CHANGE QUANTITY
      ==========================================
    */

    function changeQuantity(
      id,
      change
    ) {

      const item =
        cart.find(
          item => item.id === id
        );


      if (!item) {
        return;
      }


      const newQuantity =
        item.quantity + change;


      if (newQuantity <= 0) {

        removeFromCart(id);

        return;

      }


      if (newQuantity > item.stock) {

        alert(
          "Itna stock available nahi hai."
        );

        return;

      }


      item.quantity =
        newQuantity;


      updateCart();

    }


    /*
      ==========================================
      UPDATE CART
      ==========================================
    */

    function updateCart() {

      const cartCount =
        document.getElementById(
          "cartCount"
        );


      const cartItems =
        document.getElementById(
          "cartItems"
        );


      const cartTotal =
        document.getElementById(
          "cartTotal"
        );


      let count = 0;

      let total = 0;


      cart.forEach(item => {

        count += item.quantity;

        total +=
          item.price *
          item.quantity;

      });


      cartCount.innerText =
        count;


      cartTotal.innerText =
        "Total: Rs. " +
        total.toLocaleString();


      if (cart.length === 0) {

        cartItems.innerHTML = `

          <div class="cart-empty">
            Your cart is empty.
          </div>

        `;

        return;

      }


      cartItems.innerHTML = "";


      cart.forEach(item => {

        const div =
          document.createElement("div");


        div.className =
          "cart-item";


        div.innerHTML = `

          <div class="cart-item-top">

            <span class="cart-item-name">
              ${escapeHtml(item.name)}
            </span>

            <span class="cart-item-price">
              Rs.
              ${(item.price * item.quantity)
                .toLocaleString()}
            </span>

          </div>


          <div class="cart-controls">

            <button
              class="qty-btn"
              onclick="changeQuantity(${item.id}, -1)"
            >
              −
            </button>


            <strong>
              ${item.quantity}
            </strong>


            <button
              class="qty-btn"
              onclick="changeQuantity(${item.id}, 1)"
            >
              +
            </button>


            <button
              class="remove-btn"
              onclick="removeFromCart(${item.id})"
            >
              Remove
            </button>

          </div>

        `;


        cartItems.appendChild(div);

      });

    }


    /*
      ==========================================
      OPEN CART
      ==========================================
    */

    function openCart() {

      document.getElementById(
        "cart"
      ).style.display = "flex";


      updateCart();

    }


    /*
      ==========================================
      CLOSE CART
      ==========================================
    */

    function closeCart() {

      document.getElementById(
        "cart"
      ).style.display = "none";

    }


    /*
      ==========================================
      PLACE ORDER
      ==========================================
    */

    function placeOrder() {

      if (cart.length === 0) {

        alert(
          "Pehle cart mein product add karo."
        );

        return;

      }


      const name =
        document
          .getElementById("customerName")
          .value
          .trim();


      const phone =
        document
          .getElementById("customerPhone")
          .value
          .trim();


      const address =
        document
          .getElementById("customerAddress")
          .value
          .trim();


      const note =
        document
          .getElementById("customerNote")
          .value
          .trim();


      if (!name) {

        alert(
          "Apna naam enter karo."
        );

        return;

      }


      if (!phone) {

        alert(
          "Apna phone number enter karo."
        );

        return;

      }


      if (!address) {

        alert(
          "Delivery address enter karo."
        );

        return;

      }


      let total = 0;


      let orderText =
        "NEW ORDER\n\n";


      orderText +=
        "Customer: " +
        name +
        "\n";


      orderText +=
        "Phone: " +
        phone +
        "\n";


      orderText +=
        "Address: " +
        address +
        "\n";


      if (note) {

        orderText +=
          "Note: " +
          note +
          "\n";

      }


      orderText +=
        "\nProducts:\n";


      cart.forEach(item => {

        const itemTotal =
          item.price *
          item.quantity;


        total +=
          itemTotal;


        orderText +=
          item.name +
          " x " +
          item.quantity +
          " = Rs. " +
          itemTotal +
          "\n";

      });
