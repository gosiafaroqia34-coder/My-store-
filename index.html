<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Store</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111;
  color:white;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  font-size:22px;
}

.cart-btn{
  background:white;
  color:#111;
  border:0;
  padding:10px 15px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.hero{
  background:white;
  text-align:center;
  padding:45px 20px;
}

.hero h2{
  font-size:32px;
  margin-bottom:10px;
}

.hero p{
  color:#666;
  margin-bottom:20px;
}

.search{
  width:90%;
  max-width:500px;
  padding:14px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:16px;
  outline:none;
}

.products{
  max-width:1100px;
  margin:30px auto;
  padding:0 15px;
}

.products h2{
  margin-bottom:20px;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.product{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.product img{
  width:100%;
  height:220px;
  object-fit:cover;
  background:#eee;
  display:block;
}

.product-info{
  padding:15px;
}

.product h3{
  margin-bottom:8px;
  font-size:20px;
}

.description{
  color:#666;
  line-height:1.5;
  margin-bottom:10px;
}

.price{
  font-size:19px;
  font-weight:bold;
  margin-bottom:8px;
}

.stock{
  color:#555;
  font-size:14px;
  margin-bottom:12px;
}

.add-btn{
  width:100%;
  padding:12px;
  background:#111;
  color:white;
  border:0;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.add-btn:disabled{
  background:#aaa;
  cursor:not-allowed;
}

.loading,
.empty,
.error{
  background:white;
  padding:40px 20px;
  border-radius:12px;
  text-align:center;
  color:#666;
}

.error{
  color:#b00020;
  background:#fff0f0;
  text-align:left;
}

.cart{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.cart-box{
  background:white;
  width:100%;
  max-width:520px;
  max-height:90vh;
  overflow-y:auto;
  border-radius:12px;
  padding:20px;
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  border:0;
  background:#eee;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
  font-size:18px;
}

.cart-item{
  border-bottom:1px solid #ddd;
  padding:13px 0;
}

.cart-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.cart-controls{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:10px;
}

.qty{
  width:32px;
  height:32px;
  border:0;
  background:#eee;
  border-radius:6px;
  font-size:18px;
  cursor:pointer;
}

.remove{
  margin-left:auto;
  border:0;
  background:#ffe5e5;
  color:#b00020;
  padding:7px 10px;
  border-radius:6px;
  cursor:pointer;
}

.total{
  font-size:21px;
  font-weight:bold;
  margin:20px 0;
}

.order-form input,
.order-form textarea{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:1px solid #ddd;
  border-radius:7px;
  font-size:15px;
}

.order-form textarea{
  min-height:90px;
  resize:vertical;
}

.order-btn{
  width:100%;
  padding:13px;
  background:#111;
  color:white;
  border:0;
  border-radius:7px;
  font-weight:bold;
  cursor:pointer;
}

.message{
  display:none;
  margin-top:12px;
  padding:12px;
  border-radius:7px;
  background:#e9f8ee;
  color:#146c2e;
}

footer{
  background:#111;
  color:white;
  text-align:center;
  padding:30px;
  margin-top:40px;
}

@media(max-width:600px){

  .hero h2{
    font-size:27px;
  }

  .product img{
    height:230px;
  }
}
</style>
</head>

<body>

<header>
  <h1>My Store</h1>

  <button class="cart-btn" onclick="openCart()">
    🛒 Cart (<span id="cartCount">0</span>)
  </button>
</header>

<section class="hero">

  <h2>Welcome to My Store</h2>

  <p>Quality products at great prices</p>

  <input
    id="search"
    class="search"
    type="text"
    placeholder="Search products..."
    oninput="searchProducts()"
  >

</section>

<section class="products">

  <h2>Our Products</h2>

  <div id="productGrid" class="product-grid">

    <div class="loading">
      Products loading...
    </div>

  </div>

</section>

<div id="cart" class="cart">

  <div class="cart-box">

    <div class="cart-header">

      <h2>Your Cart</h2>

      <button class="close" onclick="closeCart()">✕</button>

    </div>

    <div id="cartItems"></div>

    <div id="cartTotal" class="total">
      Total: Rs. 0
    </div>

    <div class="order-form">

      <h3>Customer Details</h3>

      <br>

      <input
        id="customerName"
        type="text"
        placeholder="Your name"
      >

      <input
        id="customerPhone"
        type="tel"
        placeholder="Phone number"
      >

      <textarea
        id="customerAddress"
        placeholder="Delivery address"
      ></textarea>

      <textarea
        id="customerNote"
        placeholder="Order note (optional)"
      ></textarea>

      <button class="order-btn" onclick="placeOrder()">
        Place Order
      </button>

      <div id="message" class="message"></div>

    </div>

  </div>

</div>

<footer>
  © 2026 My Store. All rights reserved.
</footer>

<script>

/* =========================================
   SUPABASE CONNECTION
========================================= */

const SUPABASE_URL =
  "https://iuokntbqtjkvtdsmnc.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_-7nAjjkLSd4A_9uENlNB2Q_GHbltB4M";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   VARIABLES
========================================= */

let products = [];

let cart = [];


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

  const grid =
    document.getElementById("productGrid");

  grid.innerHTML =
    '<div class="loading">Products loading...</div>';

  try{

    const result =
      await supabaseClient
        .from("products")
        .select("*")
        .order("id",{ascending:false});

    const data = result.data;
    const error = result.error;

    if(error){

      console.error(error);

      grid.innerHTML = `
        <div class="error">

          <strong>Products load nahi ho rahe.</strong>

          <br><br>

          ${escapeHtml(error.message)}

          <br><br>

          Table:
          <strong>products</strong>

        </div>
      `;

      return;
    }

    products = data || [];

    if(products.length === 0){

      grid.innerHTML = `
        <div class="empty">
          Abhi koi product available nahi hai.
        </div>
      `;

      return;
    }

    showProducts(products);

  }
  catch(error){

    console.error(error);

    grid.innerHTML = `
      <div class="error">

        Internet ya Supabase connection ka
        error aa gaya.

        <br><br>

        ${escapeHtml(error.message)}

      </div>
    `;

  }

}


/* =========================================
   SHOW PRODUCTS
========================================= */

function showProducts(list){

  const grid =
    document.getElementById("productGrid");

  grid.innerHTML = "";

  if(list.length === 0){

    grid.innerHTML = `
      <div class="empty">
        Product nahi mila.
      </div>
    `;

    return;
  }


  list.forEach(product => {

    const id =
      product.id;

    const name =
      product.name || "Product";

    const description =
      product.description || "No description available.";

    /*
      Agar price column abhi database mein nahi hai
      to Rs. 0 show hoga.
    */

    const price =
      Number(product.price || 0);

    /*
      image_url ya image dono support hain.
    */

    const image =
      product.image_url ||
      product.image ||
      "https://via.placeholder.com/600x400?text=My+Store";

    /*
      Agar stock column database mein nahi hai
      to 99 maana jayega.
    */

    const stock =
      product.stock === undefined ||
      product.stock === null
        ? 99
        : Number(product.stock);


    const card =
      document.createElement("div");

    card.className = "product";

    card.dataset.name =
      name.toLowerCase();


    const img =
      document.createElement("img");

    img.src = image;

    img.alt = name;

    img.onerror = function(){

      this.src =
        "https://via.placeholder.com/600x400?text=My+Store";

    };


    const info =
      document.createElement("div");

    info.className =
      "product-info";


    const title =
      document.createElement("h3");

    title.textContent =
      name;


    const desc =
      document.createElement("p");

    desc.className =
      "description";

    desc.textContent =
      description;


    const priceElement =
      document.createElement("p");

    priceElement.className =
      "price";

    priceElement.textContent =
      "Rs. " +
      price.toLocaleString();


    const stockElement =
      document.createElement("p");

    stockElement.className =
      "stock";

    stockElement.textContent =
      "Stock: " + stock;


    const button =
      document.createElement("button");

    button.className =
      "add-btn";


    if(stock <= 0){

      button.disabled = true;

      button.textContent =
        "Out of Stock";

    }
    else{

      button.textContent =
        "Add to Cart";

      button.onclick = function(){

        addToCart(
          id,
          name,
          price,
          stock
        );

      };

    }


    info.appendChild(title);

    info.appendChild(desc);

    info.appendChild(priceElement);

    info.appendChild(stockElement);

    info.appendChild(button);

    card.appendChild(img);

    card.appendChild(info);

    grid.appendChild(card);

  });

}


/* =========================================
   SEARCH
========================================= */

function searchProducts(){

  const text =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const filtered =
    products.filter(product => {

      const name =
        String(product.name || "")
          .toLowerCase();

      const description =
        String(product.description || "")
          .toLowerCase();

      return (
        name.includes(text) ||
        description.includes(text)
      );

    });

  showProducts(filtered);

}


/* =========================================
   CART
========================================= */

function addToCart(
  id,
  name,
  price,
  stock
){

  const existing =
    cart.find(item => item.id === id);

  if(existing){

    if(existing.quantity >= stock){

      alert(
        "Itna stock available nahi hai."
      );

      return;
    }

    existing.quantity++;

  }
  else{

    cart.push({

      id:id,

      name:name,

      price:price,

      stock:stock,

      quantity:1

    });

  }

  updateCart();

  alert(
    name + " cart mein add ho gaya."
  );

}


function removeFromCart(id){

  cart =
    cart.filter(
      item => item.id !== id
    );

  updateCart();

}


function changeQuantity(
  id,
  change
){

  const item =
    cart.find(
      item => item.id === id
    );

  if(!item){
    return;
  }

  const newQuantity =
    item.quantity + change;

  if(newQuantity <= 0){

    removeFromCart(id);

    return;
  }

  if(newQuantity > item.stock){

    alert(
      "Itna stock available nahi hai."
    );

    return;
  }

  item.quantity =
    newQuantity;

  updateCart();

}


/* =========================================
   UPDATE CART
========================================= */

function updateCart(){

  const countElement =
    document.getElementById("cartCount");

  const itemsElement =
    document.getElementById("cartItems");

  const totalElement =
    document.getElementById("cartTotal");


  let count = 0;

  let total = 0;


  cart.forEach(item => {

    count += item.quantity;

    total +=
      item.price *
      item.quantity;

  });


  countElement.textContent =
    count;


  totalElement.textContent =
    "Total: Rs. " +
    total.toLocaleString();


  if(cart.length === 0){

    itemsElement.innerHTML = `
      <div class="cart-empty">
        Your cart is empty.
      </div>
    `;

    return;
  }


  itemsElement.innerHTML = "";


  cart.forEach(item => {

    const div =
      document.createElement("div");

    div.className =
      "cart-item";


    const top =
      document.createElement("div");

    top.className =
      "cart-top";


    const name =
      document.createElement("strong");

    name.textContent =
      item.name;


    const price =
      document.createElement("strong");

    price.textContent =
      "Rs. " +
      (
        item.price *
        item.quantity
      ).toLocaleString();


    top.appendChild(name);

    top.appendChild(price);


    const controls =
      document.createElement("div");

    controls.className =
      "cart-controls";


    const minus =
      document.createElement("button");

    minus.className =
      "qty";

    minus.textContent =
      "−";

    minus.onclick =
      function(){

        changeQuantity(
          item.id,
          -1
        );

      };


    const quantity =
      document.createElement("strong");

    quantity.textContent =
      item.quantity;


    const plus =
      document.createElement("button");

    plus.className =
      "qty";

    plus.textContent =
      "+";

    plus.onclick =
      function(){

        changeQuantity(
          item.id,
          1
        );

      };


    const remove =
      document.createElement("button");

    remove.className =
      "remove";

    remove.textContent =
      "Remove";

    remove.onclick =
      function(){

        removeFromCart(
          item.id
        );

      };


    controls.appendChild(minus);

    controls.appendChild(quantity);

    controls.appendChild(plus);

    controls.appendChild(remove);


    div.appendChild(top);

    div.appendChild(controls);

    itemsElement.appendChild(div);

  });

}


/* =========================================
   OPEN / CLOSE CART
========================================= */

function openCart(){

  document.getElementById(
    "cart"
  ).style.display = "flex";

  updateCart();

}


function closeCart(){

  document.getElementById(
    "cart"
  ).style.display = "none";

}


/* =========================================
   PLACE ORDER
========================================= */

function placeOrder(){

  if(cart.length === 0){

    alert(
      "Pehle cart mein product add karo."
    );

    return;
  }


  const name =
    document
      .getElementById("customerName")
      .value
      .trim();


  const phone =
    document
      .getElementById("customerPhone")
      .value
      .trim();


  const address =
    document
      .getElementById("customerAddress")
      .value
      .trim();


  const note =
    document
      .getElementById("customerNote")
      .value
      .trim();


  if(!name){

    alert(
      "Apna naam enter karo."
    );

    return;
  }


  if(!phone){

    alert(
      "Apna phone number enter karo."
    );

    return;
  }


  if(!address){

    alert(
      "Delivery address enter karo."
    );

    return;
  }


  let total = 0;


  let orderText =
    "NEW ORDER\n\n";


  orderText +=
    "Customer: " +
    name +
    "\n";


  orderText +=
    "Phone: " +
    phone +
    "\n";


  orderText +=
    "Address: " +
    address +
    "\n";


  if(note){

    orderText +=
      "Note: " +
      note +
      "\n";

  }


  orderText +=
    "\nProducts:\n";


  cart.forEach(item => {

    const itemTotal =
      item.price *
      item.quantity;


    total +=
      itemTotal;


    orderText +=
      item.name +
      " x " +
      item.quantity +
      " = Rs. " +
      itemTotal.toLocaleString() +
      "\n";

  });


  orderText +=
    "\nTOTAL: Rs. " +
    total.toLocaleString();


  /*
    Order ready message.
    Abhi order database mein nahi bheja ja raha.
  */

  const message =
    document.getElementById("message");


  message.style.display =
    "block";


  message.innerText =
    "Order ready hai!\n\n" +
    orderText;


  console.log(
    orderText
  );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   START
========================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    loadProducts();

    updateCart();

  }
);

</script>

</body>
  </html>
